name: Release

# Publishes lsql to PyPI via Trusted Publishing (OIDC, no API token).
# PyPI pending publisher must match exactly:
#   PyPI project name: lsql
#   Owner:             wuqunfei
#   Repository:        lsql
#   Workflow filename: release.yml
#   Environment:       pypi
#
# Trigger: push a tag like v0.1.0
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6

      - name: Build
        run: uv build

      - name: Smoke-test the wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl lsql --help > /dev/null && echo "✓ lsql --help works from installed wheel"
          uv run --isolated --no-project --with dist/*.whl python -c "import lsql, pathlib; css = pathlib.Path(lsql.__file__).parent / 'tui' / 'app.tcss'; assert css.exists(), f'{css} missing from installed wheel'; print('✓ tui/app.tcss packaged correctly')"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lsql/
    permissions:
      id-token: write   # required for OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # pypa/gh-action-pypi-publish does the OIDC exchange and also
      # uploads PEP 740 attestations (uv publish does not yet).
      - uses: pypa/gh-action-pypi-publish@release/v1
