name: Build and Publish to PyPI

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build distribution
      run: python -m build
    
    - name: Check package with twine
      run: twine check dist/*

    - name: Smoke-test the built wheel in a fresh venv
      run: |
        python -m venv /tmp/wheel-check
        /tmp/wheel-check/bin/pip install --upgrade pip
        /tmp/wheel-check/bin/pip install dist/*.whl
        /tmp/wheel-check/bin/lsql --help > /dev/null && echo "✓ lsql --help works from installed wheel"
        /tmp/wheel-check/bin/python -c "import lancedbx, pathlib; css = pathlib.Path(lancedbx.__file__).parent / 'tui' / 'app.tcss'; assert css.exists(), f'{css} missing from installed wheel'; print('✓ tui/app.tcss packaged correctly')"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-packages
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install twine
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-packages
        path: dist/
    
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/* --skip-existing
