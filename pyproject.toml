[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "lsql"
dynamic = ["version"]
description = "A terminal GUI for browsing and managing LanceDB databases"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Qunfei Wu", email = "wu.qunfei@gmail.com"},
    {name = "Davide Dal Farra", email = "davide@codref.org"},
]
keywords = ["lancedb", "lsql", "cli", "database", "duckdb", "tui", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Utilities",
]

dependencies = [
    "lancedb>=0.39.0",
    "duckdb>=1.5.0",
    "pandas>=1.0.0",
    "typer>=0.27.0",
    "rich>=15.0.0",
    "textual>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[tool.setuptools.dynamic]
version = {attr = "lsql.__version__"}

[project.urls]
Homepage = "https://github.com/wuqunfei/lsql"
Documentation = "https://github.com/wuqunfei/lsql#readme"
Repository = "https://github.com/wuqunfei/lsql.git"
"Bug Tracker" = "https://github.com/wuqunfei/lsql/issues"

[project.scripts]
lsql = "lsql.__main__:main"

[tool.setuptools.packages.find]
include = ["lsql*"]

[tool.setuptools.package-data]
lsql = ["tui/*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
